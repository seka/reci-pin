<ng-template #content><ng-content></ng-content></ng-template>

@switch (variant) {
  @case ('primary') {
    <button
      mat-flat-button
      color="primary"
      [type]="type"
      [disabled]="disabled"
      (click)="handleClick($event)"
    >
      <ng-container *ngTemplateOutlet="content"></ng-container>
    </button>
  }
  @case ('secondary') {
    <button
      mat-flat-button
      color="accent"
      [type]="type"
      [disabled]="disabled"
      (click)="handleClick($event)"
    >
      <ng-container *ngTemplateOutlet="content"></ng-container>
    </button>
  }
  @case ('outline') {
    <button
      mat-stroked-button
      color="primary"
      [type]="type"
      [disabled]="disabled"
      (click)="handleClick($event)"
    >
      <ng-container *ngTemplateOutlet="content"></ng-container>
    </button>
  }
  @case ('text') {
    <button mat-button [type]="type" [disabled]="disabled" (click)="handleClick($event)">
      <ng-container *ngTemplateOutlet="content"></ng-container>
    </button>
  }
  @case ('warn') {
    <button
      mat-button
      color="warn"
      [type]="type"
      [disabled]="disabled"
      (click)="handleClick($event)"
    >
      <ng-container *ngTemplateOutlet="content"></ng-container>
    </button>
  }
  @case ('accent') {
    <button
      mat-button
      color="accent"
      [type]="type"
      [disabled]="disabled"
      (click)="handleClick($event)"
    >
      <ng-container *ngTemplateOutlet="content"></ng-container>
    </button>
  }
}
