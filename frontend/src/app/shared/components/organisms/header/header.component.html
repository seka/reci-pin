<header class="app-header">
  <div class="header-content">
    <app-logo size="medium"></app-logo>
    <div class="actions">
      <div class="lang-switcher">
        <button class="lang-btn" [class.active]="currentLang === 'ja'" (click)="switchLang('ja')">
          JP
        </button>
        <span class="divider">/</span>
        <button class="lang-btn" [class.active]="currentLang === 'en'" (click)="switchLang('en')">
          EN
        </button>
      </div>
      @if (currentUser$ | async; as user) {
        <div class="user-actions">
          <span class="username">{{ 'COMMON.HELLO' | transloco }}, {{ user.name }}</span>
          <app-button variant="text" (click)="onLogout()">{{
            'COMMON.LOGOUT' | transloco
          }}</app-button>
        </div>
      }
    </div>
  </div>
</header>
