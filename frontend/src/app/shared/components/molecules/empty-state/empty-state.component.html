<div class="empty-state">
  @if (icon) {
    <div class="icon-container">
      <mat-icon class="empty-icon">{{ icon }}</mat-icon>
    </div>
  }
  @if (title) {
    <h3 class="empty-title">{{ title }}</h3>
  }
  @if (message) {
    <p class="empty-message">{{ message }}</p>
  }
  <div class="empty-actions">
    <ng-content></ng-content>
  </div>
</div>
