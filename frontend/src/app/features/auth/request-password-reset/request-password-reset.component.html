<app-auth-card [title]="'AUTH.RESET_PASSWORD_TITLE' | translate">
    <form (ngSubmit)="onSubmit()">
        <p style="margin-bottom: var(--spacing-3); color: var(--color-text-secondary); font-size: var(--font-size-2);"
            [innerHTML]="'AUTH.RESET_PASSWORD_REQUEST_DESC' | translate">
        </p>

        <app-input [label]="'AUTH.EMAIL' | translate" type="email" [(ngModel)]="email" name="email" [required]="true"
            [maxLength]="200" [showCounter]="true"></app-input>

        <div class="actions" style="margin-top: var(--spacing-3); margin-bottom: var(--spacing-2);">
            <app-button variant="primary" type="submit" class="submit-btn" style="width: 100%;" [disabled]="isLoading">
                {{ isLoading ? ('COMMON.SENDING' | translate) : ('COMMON.SEND' | translate) }}
            </app-button>
        </div>

        <app-alert type="success" [message]="message"></app-alert>
        <app-alert type="error" [message]="errorMessage"></app-alert>
    </form>

    <div footer>
        <a routerLink="/login" style="text-decoration: none;">
            <app-button variant="text" type="button" class="full-width-btn" style="width: 100%;">
                {{ 'AUTH.BACK_TO_LOGIN' | translate }}
            </app-button>
        </a>
    </div>
</app-auth-card>
