<app-auth-card title="パスワード再設定">
    <form (ngSubmit)="onSubmit()">
        <p style="margin-bottom: 24px; color: #666; font-size: 14px;">
            登録済みのメールアドレスを入力してください。<br>
            パスワード再設定用のリンクをお送りします。
        </p>

        <app-input label="メールアドレス" type="email" [(ngModel)]="email" name="email" [required]="true"></app-input>

        <div class="actions" style="margin-top: 24px; margin-bottom: 16px;">
            <app-button variant="primary" type="submit" class="submit-btn" style="width: 100%;" [disabled]="isLoading">
                {{ isLoading ? '送信中...' : '送信する' }}
            </app-button>
        </div>

        @if (message) {
        <p class="success" style="color: #4caf50; margin-top: 16px; text-align: center;">{{ message }}</p>
        }
        @if (errorMessage) {
        <p class="error" style="color: #f44336; margin-top: 16px; text-align: center;">{{ errorMessage }}</p>
        }
    </form>

    <div footer>
        <a routerLink="/login" style="text-decoration: none;">
            <app-button variant="text" type="button" class="full-width-btn" style="width: 100%;">
                ログイン画面へ戻る
            </app-button>
        </a>
    </div>
</app-auth-card>
