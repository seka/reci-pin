<app-auth-card title="パスワード再設定">
    <form (ngSubmit)="onSubmit()">
        <p style="margin-bottom: var(--spacing-3); color: var(--color-text-secondary); font-size: var(--font-size-2);">
            登録済みのメールアドレスを入力してください。<br>
            パスワード再設定用のリンクをお送りします。
        </p>

        <app-input label="メールアドレス" type="email" [(ngModel)]="email" name="email" [required]="true"></app-input>

        <div class="actions" style="margin-top: var(--spacing-3); margin-bottom: var(--spacing-2);">
            <app-button variant="primary" type="submit" class="submit-btn" style="width: 100%;" [disabled]="isLoading">
                {{ isLoading ? '送信中...' : '送信する' }}
            </app-button>
        </div>

        @if (message) {
        <p class="success" style="color: var(--color-success); margin-top: var(--spacing-2); text-align: center;">{{
            message }}</p>
        }
        @if (errorMessage) {
        <p class="error" style="color: var(--color-error); margin-top: var(--spacing-2); text-align: center;">{{
            errorMessage }}</p>
        }
    </form>

    <div footer>
        <a routerLink="/login" style="text-decoration: none;">
            <app-button variant="text" type="button" class="full-width-btn" style="width: 100%;">
                ログイン画面へ戻る
            </app-button>
        </a>
    </div>
</app-auth-card>
