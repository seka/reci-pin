<app-auth-card [title]="'FEATURES.AUTH.RESET_PASSWORD.TITLE' | translate">
  <form (ngSubmit)="onSubmit()">
    <p class="description">
      {{ 'FEATURES.AUTH.REQUEST_PASSWORD_RESET.DESC' | translate }}
    </p>

    <app-input
      [label]="'FEATURES.AUTH.LOGIN.EMAIL' | translate"
      type="email"
      [(ngModel)]="email"
      name="email"
      [required]="true"
      [maxLength]="200"
      [showCounter]="true"
    ></app-input>

    <div class="actions">
      <app-button
        variant="primary"
        type="submit"
        class="submit-btn"
        [disabled]="isLoading || !email"
      >
        {{ isLoading ? ('COMMON.SENDING' | translate) : ('COMMON.SEND' | translate) }}
      </app-button>
    </div>

    <app-alert type="success" [message]="message"></app-alert>
    <app-alert type="error" [message]="errorMessage"></app-alert>
  </form>

  <div footer>
    <app-link routerLink="/login" class="back-link">
      <app-button variant="text" type="button" class="back-btn">
        {{ 'FEATURES.AUTH.RESET_PASSWORD.BACK_TO_LOGIN' | translate }}
      </app-button>
    </app-link>
  </div>
</app-auth-card>
