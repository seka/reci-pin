<app-auth-card [title]="'AUTH.RESET_PASSWORD_NEW_TITLE' | translate">
    <form (ngSubmit)="onSubmit()">
        <p style="margin-bottom: var(--spacing-3); color: var(--color-text-secondary); font-size: var(--font-size-2);">
            {{ 'AUTH.RESET_PASSWORD_NEW_DESC' | translate }}
        </p>

        <app-input [label]="'AUTH.NEW_PASSWORD' | translate" type="password" [(ngModel)]="newPassword"
            name="newPassword" [required]="true" [maxLength]="200" [showCounter]="true" [disabled]="!token"></app-input>

        <div class="actions" style="margin-top: var(--spacing-3); margin-bottom: var(--spacing-2);">
            <app-button variant="primary" type="submit" class="submit-btn" style="width: 100%;"
                [disabled]="isLoading || !token">
                {{ isLoading ? ('AUTH.SETTING_PASSWORD' | translate) : ('AUTH.SET_PASSWORD' | translate) }}
            </app-button>
        </div>

        @if (message) {
            <app-alert type="success">
                {{ message }}<br>
                {{ 'AUTH.REDIRECTING_LOGIN' | translate }}
            </app-alert>
        }
        <app-alert type="error" [message]="errorMessage"></app-alert>
    </form>

    <div footer>
        <a routerLink="/login" style="text-decoration: none;">
            <app-button variant="text" type="button" class="full-width-btn" style="width: 100%;">
                {{ 'AUTH.BACK_TO_LOGIN' | translate }}
            </app-button>
        </a>
    </div>
</app-auth-card>
