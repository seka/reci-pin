<app-auth-card title="新しいパスワードの設定">
    <form (ngSubmit)="onSubmit()">
        <p style="margin-bottom: 24px; color: #666; font-size: 14px;">
            新しいパスワードを入力してください。
        </p>

        <app-input label="新しいパスワード" type="password" [(ngModel)]="newPassword" name="newPassword" [required]="true"
            [disabled]="!token"></app-input>

        <div class="actions" style="margin-top: 24px; margin-bottom: 16px;">
            <app-button variant="primary" type="submit" class="submit-btn" style="width: 100%;"
                [disabled]="isLoading || !token">
                {{ isLoading ? '設定中...' : 'パスワードを設定する' }}
            </app-button>
        </div>

        @if (message) {
        <p class="success" style="color: #4caf50; margin-top: 16px; text-align: center;">
            {{ message }}<br>
            ログイン画面へ移動します...
        </p>
        }
        @if (errorMessage) {
        <p class="error" style="color: #f44336; margin-top: 16px; text-align: center;">{{ errorMessage }}</p>
        }
    </form>

    <div footer>
        <a routerLink="/login" style="text-decoration: none;">
            <app-button variant="text" type="button" class="full-width-btn" style="width: 100%;">
                ログイン画面へ戻る
            </app-button>
        </a>
    </div>
</app-auth-card>
