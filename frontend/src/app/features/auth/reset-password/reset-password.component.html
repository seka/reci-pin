<app-auth-card [title]="'AUTH.RESET_PASSWORD_NEW_TITLE' | translate">
  <form (ngSubmit)="onSubmit()">
    <p class="description">
      {{ 'AUTH.RESET_PASSWORD_NEW_DESC' | translate }}
    </p>

    <app-input
      [label]="'AUTH.NEW_PASSWORD' | translate"
      type="password"
      [(ngModel)]="newPassword"
      name="newPassword"
      [required]="true"
      [maxLength]="200"
      [showCounter]="true"
      [disabled]="!token"
    ></app-input>

    <div class="actions">
      <app-button
        variant="primary"
        type="submit"
        class="submit-btn"
        [disabled]="isLoading || !token"
      >
        {{ isLoading ? ('AUTH.SETTING_PASSWORD' | translate) : ('AUTH.SET_PASSWORD' | translate) }}
      </app-button>
    </div>

    @if (message) {
      <app-alert type="success">
        {{ message }}<br />
        {{ 'AUTH.REDIRECTING_LOGIN' | translate }}
      </app-alert>
    }
    <app-alert type="error" [message]="errorMessage"></app-alert>
  </form>

  <div footer>
    <app-link routerLink="/login" class="back-link">
      <app-button variant="text" type="button" class="back-btn">
        {{ 'AUTH.BACK_TO_LOGIN' | translate }}
      </app-button>
    </app-link>
  </div>
</app-auth-card>
